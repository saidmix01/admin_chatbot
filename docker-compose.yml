services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin_chatbot_app
    ports:
      - "3035:80"
    volumes:
      - ./:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=${DB_HOST:-192.168.1.6}
      - DB_PORT=${DB_PORT:-5433}
      - DB_USER=wapi
      - DB_PASSWORD=wapi_secret_2026
      - DB_NAME=admin_chatbot
      - APP_ENV=development
      - BASE_URL=http://localhost:3035/
    networks:
      - wapi-network

  db:
    restart: unless-stopped
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: admin_chatbot_db
    environment:
      POSTGRES_DB: admin_chatbot
      POSTGRES_USER: wapi
      POSTGRES_PASSWORD: wapi_secret_2026
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wapi -d admin_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wapi-network

volumes:
  pgdata:

networks:
  wapi-network:
    driver: bridge
